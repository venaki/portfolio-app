name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Flutter 3.41.5 (Dart 3.11.3)
        env:
          FLUTTER_REVISION: 2c9eb20739dfec95e2c74bd3dfa4601b0a8a36aa
        run: |
          git clone --depth 1 --branch 3.41.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          test "$(git -C "$RUNNER_TEMP/flutter-sdk" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --no-pub
      - name: Build Firebase and GitHub Pages bundles
        run: bash scripts/build_web.sh

  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portfolio-cors-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: portfolio-cors-proxy/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
