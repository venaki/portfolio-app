name = "portfolio-cors-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-08"

[vars]
ALLOWED_ORIGINS = "https://venaki.github.io,https://portfolio-app-venaki-ed7b4.web.app,https://portfolio-app-venaki-ed7b4.firebaseapp.com,http://localhost:8080"
FIREBASE_PROJECT_ID = "portfolio-app-venaki-ed7b4"

[[durable_objects.bindings]]
name = "AUTH_STATE"
class_name = "AuthState"

[[migrations]]
tag = "v1-auth-state"
new_sqlite_classes = ["AuthState"]

# GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are set via `wrangler secret put`
